name: CI Final

on:
  pull_request:
    branches:
        - main

jobs:
  final-test:
    name: ${{ matrix.profile.name }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ger0u/sharewave-dev:latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - name: Clang Release
            type: clang-release
          - name: Clang Release -O1 ASan + UBSan
            type: clang-release-asan
          - name: GCC Release
            type: gcc-release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ matrix.profile.type }}-${{ hashFiles('conanfile.py', format('profiles/{0}', matrix.profile.type)) }}
          restore-keys: |
            conan-${{ runner.os }}-${{ matrix.profile.type }}-

      - name: Build and test (${{ matrix.profile.name }})
        run: ./scripts/ci-build-and-test.sh ${{ matrix.profile.type }}

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results (${{ matrix.profile.name }})
          path: build/test-results.xml
          reporter: java-junit

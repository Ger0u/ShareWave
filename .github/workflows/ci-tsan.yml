name: CI TSan (Optional)

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  clang-debug-tsan:
    name: Clang Debug TSan
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-tsan'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ger0u/sharewave-dev:latest
      options: --security-opt seccomp=unconfined

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-clang-debug-tsan-${{ hashFiles('conanfile.txt', 'profiles/clang-debug-tsan') }}
          restore-keys: |
            conan-${{ runner.os }}-clang-debug-tsan-

      - name: Build and test (Clang Debug TSan)
        run: ./scripts/ci-build-and-test.sh clang-debug-tsan

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results (Clang Debug TSan)
          path: build/test-results.xml
          reporter: java-junit
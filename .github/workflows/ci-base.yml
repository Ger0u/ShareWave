name: CI Base

on:
  push:
    branches-ignore:
      - main

jobs:
  clang-debug-asan:
    name: Clang Debug ASan + UBSan
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ger0u/sharewave-dev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-clang-debug-asan-${{ hashFiles('conanfile.txt', 'profiles/clang-debug-asan') }}
          restore-keys: |
            conan-${{ runner.os }}-clang-debug-asan-

      - name: Build and test (Clang Debug ASan + UBSan)
        run: ./scripts/ci-build-and-test.sh clang-debug-asan

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results (Clang Debug ASan + UBSan)
          path: build/test-results.xml
          reporter: java-junit
